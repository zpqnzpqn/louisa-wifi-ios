name: LouisaWiFi
options:
  bundleIdPrefix: io.github.zpqnzpqn
  deploymentTarget:
    iOS: 17.0
  createIntermediateGroups: true
targets:
  LouisaWiFi:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LouisaWiFi
    settings:
      base:
        PRODUCT_NAME: Louisa Wi-Fi
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zpqnzpqn.LouisaWiFi
        INFOPLIST_FILE: LouisaWiFi/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LouisaWiFi/Resources/LouisaWiFi.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: false
        TARGETED_DEVICE_FAMILY: "1"
